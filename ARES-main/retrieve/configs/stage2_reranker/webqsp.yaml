task: 'stage2_reranker'

env:
  num_threads: 16
  seed: 42

dataset:
  name: 'webqsp'
  text_encoder_name: 'gte-large-en-v1.5'

stage1:
  checkpoint_path: 'webqsp_Jun22-08:58:11/cpt.pth'
  retrieval_dir: 'webqsp_Jun22-08:58:11'
  candidate_top_k: 500

label:
  dir: 'data_files/webqsp/label'
  direct_label: 1.0
  bridge_label: 0.7
  weak_label: 0.3

cache:
  output_dir: 'stage2_cache/webqsp'
  tensor_dtype: 'float16'
  distance_cap: 6

model:
  hidden_dims: '1024,256'
  dropout: 0.1

optimizer:
  lr: 1e-3
  weight_decay: 0.0

eval:
  k_list: '50,100,200'
  max_eval_samples: 0
  target_k: 200
  checkpoint_metric: 'combined'
  combined_beta: 0.5

pairwise:
  enabled: true
  weight: 0.15
  max_pos: 32
  max_neg: 32
  hard_negative_top_k: 50
  hard_negative_top_percent: 0.1
  high_conf_min_topic_distance: 2
  mid_band_enabled: true
  mid_band_start_idx: 49
  mid_band_end_idx: 249

answer_aux:
  enabled: true
  weight: 0.28
  pos_weight_cap: 50.0
  min_answer_weight: 0.32
  multi_answer_min_cov_boost: 0.06
  multi_answer_touch_boost: 0.0

train:
  num_epochs: 10000
  patience: 10
  batch_size: 1
  save_prefix: 'stage2_webqsp'
  output_dir: 'stage2_results'
  oversample_multi_answer: true
  multi_answer_extra_copies: 1

inference:
  use_cache: true
  output_dir: 'stage2_results/inference/webqsp'
  output_prefix: 'retrieval_result'
  fusion_mode: 'logit_sum'
  stage2_logit_scale: 1.0
  fusion_weight_stage1: 0.93
  fusion_weight_stage2: 0.07
